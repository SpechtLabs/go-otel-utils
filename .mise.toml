# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how go-otel-utils is built and checked. CI uses these
# tasks. Renovate keeps every pin in this file current.
#
# The repository holds three Go modules, otelprovider, otelzap and example,
# released together by release-please. Every Go task runs in each of them, or
# in the ones named: `mise run test otelzap`.

# mise reads the go directive of the nearest go.mod as the Go version to use,
# so inside a module it would run that minimum version rather than the one
# pinned below. Every tool comes from this file only.
[settings]
idiomatic_version_file_enable_tools = []

[env]
GO_MODULES = "otelprovider otelzap example"

[tools]
# The go directive in each go.mod is the minimum language version, bumped by
# hand; this is the toolchain everything runs on.
go = "1.27.2"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Runs .github/commit-lint, the squash commit message check in
# pr-hygiene.yaml.
bun = "1.4.2"

[tasks.build]
description = "Build every module"
usage = 'arg "[module]..." help="The modules to run in (default: all)" var=#true'
run = 'for m in ${usage_module:-$GO_MODULES}; do (cd "$m" && go build ./...) || exit 1; done'

# Each module writes its own coverage.txt, which CI uploads to Codecov under
# the module's flag.
[tasks.test]
description = "Run every module's tests with race detector and coverage"
usage = 'arg "[module]..." help="The modules to run in (default: all)" var=#true'
run = 'for m in ${usage_module:-$GO_MODULES}; do (cd "$m" && go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.txt ./...) || exit 1; done'

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file. go mod tidy runs
# first, because it may rewrite go.mod.
[tasks.fmt]
description = "Format everything: go.mod and Go sources"
run = [
  { task = "go-tidy" },
  { task = "go-fmt" },
]

[tasks.go-tidy]
description = "Tidy every module's go.mod and go.sum"
usage = 'arg "[module]..." help="The modules to run in (default: all)" var=#true'
run = 'for m in ${usage_module:-$GO_MODULES}; do (cd "$m" && go mod tidy) || exit 1; done'

# The same gofmt and goimports settings `mise run lint` checks, read from
# .golangci.yaml.
[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
usage = 'arg "[module]..." help="The modules to run in (default: all)" var=#true'
run = 'for m in ${usage_module:-$GO_MODULES}; do (cd "$m" && golangci-lint fmt --config ../.golangci.yaml) || exit 1; done'

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). Rebuilds only when .custom-gcl.yml changes.
[tasks.lint-build]
description = "Build the custom-gcl binary with the golint-sl plugin baked in"
# The build downloads golangci-lint's whole dependency tree, and the module
# proxy sometimes resets the HTTP/2 stream partway through. Modules already
# downloaded stay in the cache, so a retry picks up where it failed.
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml"]
outputs = ["custom-gcl"]

# A module's go.mod is what consumers resolve against, so an untidy one has
# to fail CI rather than ship in a release.
[tasks.mod-tidy]
description = "Check that every module's go.mod and go.sum are tidy"
usage = 'arg "[module]..." help="The modules to run in (default: all)" var=#true'
run = 'for m in ${usage_module:-$GO_MODULES}; do (cd "$m" && go mod tidy -diff) || exit 1; done'

[tasks.lint]
description = "Lint every module with golangci-lint and golint-sl, YAML and workflows"
depends = ["lint-build", "yaml-lint", "actionlint"]
run = [{ task = "go-lint" }]

# go-lint runs a custom-gcl that's already built; CI's cached path calls it
# directly.
[tasks.go-lint]
description = "Lint every module with the custom-gcl binary lint-build wrote"
usage = 'arg "[module]..." help="The modules to run in (default: all)" var=#true'
run = 'for m in ${usage_module:-$GO_MODULES}; do (cd "$m" && ../custom-gcl run --config ../.golangci.yaml ./...) || exit 1; done'

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.check]
description = "The definition of done: every gate CI runs"
depends = [
  "lint",
  "mod-tidy",
  "test",
]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run"
