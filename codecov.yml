# Codecov fails a pull request when the lines it changes are less than 85%
# covered, or when it lowers the project's coverage. The project target follows
# the base branch (auto) rather than a fixed 85%, because otelzap's wrappers
# around zap's API are mostly untested and the project sits well below it;
# raise it to 85% once the project gets there.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 85%

# Each upload carries its module's flag, otelprovider or otelzap, from
# go.yaml's test jobs. A flag missing from a commit's uploads keeps its last
# coverage rather than counting as none.
flag_management:
  default_rules:
    carryforward: true

# The example ships nothing and has no tests.
ignore:
  - "example/**"
