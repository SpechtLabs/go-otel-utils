# golangci-lint configuration for go-otel-utils.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml).
# The prebuilt golangci-lint cannot load the plugin, so run it with
# `mise run lint`, which builds custom-gcl and runs it in every module.
# https://golangci-lint.run/usage/configuration/
#
# Each module is linted from its own directory with --config ../.golangci.yaml.
# Paths in the exclusions below are relative to this file, so they start with
# the module's directory.

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: cfg

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      # fieldalignment stays on: a logger is on every caller's hot path, so
      # its structs should stay compact. Test tables are excluded below.
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # otelzap is a logger: its methods are the log calls, made on the
      # caller's behalf with the caller's fields, so the checks for code that
      # logs (wide events with request context, sensitive parameters reaching
      # a log call) see every method as a violation. Its error returns
      # implement zapcore's interfaces and pass zap's errors through, and
      # With mirrors zap.Logger.With; changing either would break the API it
      # exists to wrap.
      - linters:
          - golint-sl
        text: "^(wideevents|dataflow|humaneerror|errorwrap|optionspattern):"
        path: ^otelzap/

      # Attribute and LogValue switch on the value's type, and the switch's nil
      # case handles a nil value; nilcheck takes the switch variable for a
      # pointer parameter.
      - linters:
          - golint-sl
        text: "^nilcheck:"
        path: ^otelzap/attribute\.go$

      # otelprovider's options log the one fatal error of setting up an
      # exporter, before any request exists to take a trace ID from, and they
      # construct the exporter clients they configure by design.
      - linters:
          - golint-sl
        text: "^(wideevents|interfaceconsistency):"
        path: ^otelprovider/

      # The exporter options are functional options with no error return, so
      # a failure to create an exporter can't reach the caller; they exit the
      # process at startup, as their docs say. Returning the error instead
      # would change the signature of every option in the public API.
      - linters:
          - golint-sl
        text: "^nopanic:"
        path: ^otelprovider/(logging|tracing)\.go$

      # The example logs made-up errors to show what each level records.
      - linters:
          - golint-sl
        text: "^humaneerror:"
        path: ^example/

    paths:
      - third_party$
      - builtin$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
