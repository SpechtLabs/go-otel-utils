name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Quality Validations
    runs-on: ubuntu-latest

    strategy:
      matrix:
        folder:
          - example
          - otelprovider
          - otelzap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "${{ matrix.folder }}/go.mod"
          cache: true
          cache-dependency-path: "${{ matrix.folder }}/*.sum"

      - name: GolangCI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: "${{ matrix.folder }}/"
          version: latest

      - name: Run format-check
        working-directory: "${{ matrix.folder }}/"
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted according to gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        folder:
          - example
          - otelprovider
          - otelzap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "${{ matrix.folder }}/go.mod"
          cache: true
          cache-dependency-path: "${{ matrix.folder }}/*.sum"

      - name: Run tests
        working-directory: "${{ matrix.folder }}/"
        run: go test -race -cover -covermode=atomic ./...

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs:
      - validate
      - test

    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
