name: Go

# The three Go modules: lint, tidiness and unit tests. ci.yaml calls it for
# pull requests, release.yaml gates every release on it, and it runs on its
# own from the Actions tab.
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first, which
  # makes each job wait on (and fail with) downloads for tools it never runs.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.4
  # Every tool a CI job runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache: main's runs save it
  # and every pull request restores it, rather than each job keeping a copy
  # of its own subset.
  MISE_TOOLS: go golangci-lint yamllint actionlint shellcheck

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # Go's module and build caches, and golangci-lint's analysis cache. Like
      # setup-go, the key is the dependency set: the first run after a go.sum
      # changes saves it (main's run, which pull requests then restore), and it
      # isn't rewritten until a go.sum changes again.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-

      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      # Builds ./custom-gcl (golangci-lint + golint-sl) and runs it in every
      # module, along with yamllint and actionlint. The golint-sl plugin and
      # the gofmt/goimports formatters are both applied here.
      - name: Lint
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run lint

      # The cached path skips `mise run lint` and its build of custom-gcl, so
      # it runs the linters that task depends on by hand. The matcher turns
      # actionlint's output into annotations on the PR diff.
      - name: Lint with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ./custom-gcl
          mise run go-lint
          mise run yaml-lint
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

      # A consumer resolves against each module's go.mod as it's tagged, so it
      # must be tidy before a release ever tags it.
      - name: Check every go.mod is tidy
        run: mise run mod-tidy

  test:
    name: Unit Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - otelprovider
          - otelzap
          - example
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # See the lint job. The build cache holds test results too, so a package
      # whose code and inputs didn't change since the cache was saved reports
      # (cached) rather than running again.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ matrix.module }}-${{ runner.os }}-${{ hashFiles(format('{0}/go.mod', matrix.module), format('{0}/go.sum', matrix.module)) }}
          restore-keys: go-test-${{ matrix.module }}-${{ runner.os }}-

      - name: Run tests
        run: mise run test ${{ matrix.module }}

      # The example ships nothing, and has no tests of its own; building it
      # above is its check.
      - name: Upload coverage to Codecov
        if: matrix.module != 'example'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module }}/coverage.txt
          flags: ${{ matrix.module }}
          fail_ci_if_error: false
